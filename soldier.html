<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soldier — East German 1970s</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #a8b8c8; height: 100%; }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 16px; left: 16px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #111;
    background: rgba(255,255,255,0.9);
    border: 2px solid #333;
    padding: 12px 16px;
    line-height: 1.7;
    letter-spacing: 0.5px;
    pointer-events: none;
    user-select: none;
    z-index: 20;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  #hud b { color: #000; font-weight: bold; }

  #uniformSelect {
    position: fixed;
    top: 16px; right: 16px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #111;
    background: rgba(255,255,255,0.9);
    border: 2px solid #333;
    padding: 10px 14px;
    line-height: 1.5;
    pointer-events: auto;
    user-select: none;
    z-index: 20;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  #uniformSelect button {
    display: block;
    margin: 4px 0;
    padding: 6px 10px;
    background: #f5f5f5;
    border: 1px solid #666;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    border-radius: 2px;
  }
  #uniformSelect button:hover { background: #e8e8e8; }
  #uniformSelect button.active { background: #2d5016; color: #fff; }

  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.6);
  }

  #cameraInfo {
    position: fixed;
    bottom: 16px; left: 16px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #555;
    background: rgba(255,255,255,0.75);
    border: 1px solid #999;
    padding: 8px 12px;
    pointer-events: none;
    z-index: 15;
    line-height: 1.5;
  }

  #clickCatcher {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(168,184,200,0.95);
    font-family: 'Courier New', monospace;
    color: #222;
    font-size: 16px;
    cursor: pointer;
    z-index: 10;
    text-align: center;
  }
  #clickCatcher.hidden { display: none; }

  /* Mobile controls */
  #mobileControls {
    display: none;
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #mobileControls.active { display: block; }

  #joystickZone {
    position: fixed;
    left: 24px; bottom: 24px;
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.25);
    pointer-events: auto;
    touch-action: none;
  }
  #joystickStick {
    position: absolute;
    top: 50%; left: 50%;
    width: 54px; height: 54px;
    margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    pointer-events: none;
  }

  #lookZone {
    position: fixed;
    right: 0; top: 0;
    width: 55%; height: 100%;
    pointer-events: auto;
    touch-action: none;
  }

  .mobileBtn {
    position: fixed;
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.12);
    border: 1px solid rgba(0,0,0,0.25);
    color: #222;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.5px;
    font-weight: bold;
  }
  .mobileBtn:active { background: rgba(0,0,0,0.28); }

  #jumpBtn {
    right: 24px; bottom: 30px;
    width: 74px; height: 74px;
    background: rgba(100,180,80,0.15);
    border-color: rgba(100,180,80,0.35);
    color: #2d5a1a;
  }
  #jumpBtn:active { background: rgba(100,180,80,0.32); }

  #sprintBtn {
    right: 110px; bottom: 30px;
    width: 74px; height: 74px;
    background: rgba(100,140,200,0.15);
    border-color: rgba(100,140,200,0.35);
    color: #1a3a5a;
  }
  #sprintBtn:active { background: rgba(100,140,200,0.32); }

  #fireBtn {
    right: 24px; bottom: 116px;
    width: 80px; height: 80px;
    background: rgba(180,40,30,0.18);
    border-color: rgba(180,40,30,0.4);
    color: #7a1f16;
    font-size: 12px;
  }
  #fireBtn:active { background: rgba(180,40,30,0.35); }

  #mobileHint {
    position: fixed;
    top: 16px; right: 16px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #666;
    background: rgba(255,255,255,0.85);
    border: 1px solid #ccc;
    padding: 6px 10px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <b>WASD</b> move &nbsp; <b>SHIFT</b> sprint &nbsp; <b>SPACE</b> jump<br>
  <b>MOUSE</b> look &nbsp; <b>RIGHT-CLICK</b> fire &nbsp; <b>ESC</b> release cursor<br>
  <b>Q</b>/<b>E</b> adjust camera distance &nbsp; <b>Z</b>/<b>X</b> tilt<br>
  <span style="color:#999; font-size:11px;">(touch: joystick + drag to look + buttons)</span>
</div>

<div id="uniformSelect">
  <div style="margin-bottom: 6px; font-weight: bold; font-size: 10px;">UNIFORM</div>
  <button class="active" data-uniform="0">Combat</button>
  <button data-uniform="1">Armored</button>
  <button data-uniform="2">Officer</button>
</div>

<div id="crosshair"></div>
<div id="cameraInfo"></div>
<div id="clickCatcher">click to enter<br><span style="font-size:12px;color:#555;">(pointer lock — mouse controls camera)</span></div>

<div id="mobileControls">
  <div id="joystickZone"><div id="joystickStick"></div></div>
  <div id="lookZone"></div>
  <div id="jumpBtn" class="mobileBtn">JUMP</div>
  <div id="sprintBtn" class="mobileBtn">SPRINT</div>
  <div id="fireBtn" class="mobileBtn">FIRE</div>
  <div id="mobileHint">drag right side to look</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================================
// SCENE / RENDERER / CAMERA
// ============================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8b8c8);
scene.fog = new THREE.Fog(0xa8b8c8, 35, 120);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, precision: 'highp' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// LIGHTING
// ============================================================================
const hemi = new THREE.HemisphereLight(0xd8e8f8, 0x8080a0, 1.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0015;
scene.add(sun);

// ============================================================================
// GROUND — detailed terrain
// ============================================================================
const groundGeo = new THREE.PlaneGeometry(500, 500);
const groundMat = new THREE.MeshStandardMaterial({ 
  color: 0x7a8d6f, 
  roughness: 0.9, 
  metalness: 0,
  map: null
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
ground.castShadow = false;
scene.add(ground);

// Detailed grid
const gridHelper = new THREE.GridHelper(500, 100, 0x5a6d4f, 0x7a8d6f);
gridHelper.position.y = 0.02;
scene.add(gridHelper);

// ============================================================================
// SOLDIER — East German NVA 1970s with extensive detail
// ============================================================================
const palette = {
  skin: 0xd4a574,
  
  // East German olive (Feldgrau-style)
  combat: {
    uniform: 0x4a5a2a,
    uniformDark: 0x3a4a1a,
    helmet: 0x3d4a1f,
    webgear: 0x2a2a2a,
    boots: 0x1a1a1a,
    insignia: 0xc4b040,
  },
  
  armored: {
    uniform: 0x323d1a,
    uniformDark: 0x242e12,
    helmet: 0x2a351f,
    webgear: 0x1a1a1a,
    boots: 0x0f0f0f,
    insignia: 0xb8a030,
  },
  
  officer: {
    uniform: 0x5a6a3a,
    uniformDark: 0x4a5a2a,
    helmet: 0x4d5a32,
    webgear: 0x3a3a3a,
    boots: 0x2a2a2a,
    insignia: 0xd4c050,
  },
  
  metal: 0x4a4a4a,
};

let currentUniformVariant = 0;
let soldier = null;
let torso = null;
let headGroup = null;
let armL = null, armR = null;
let legL = null, legR = null;
let legLLower = null, legRLower = null;
let rifle = null;
let muzzleFlash = null;

function box(w, h, d, color, castShadow = true) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ 
    color, 
    roughness: 0.8, 
    metalness: 0.08,
    side: THREE.FrontSide
  });
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  return m;
}

function cylinder(rTop, rBot, h, color, castShadow = true) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, h, 12);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.05 });
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  return m;
}

function createSoldier(uniformVariant = 0) {
  if (soldier) scene.remove(soldier);
  
  const colors = palette[['combat', 'armored', 'officer'][uniformVariant]];
  soldier = new THREE.Group();

  // === LOWER TORSO ===
  const hips = box(0.42, 0.22, 0.26, colors.uniform);
  hips.position.y = 0.95;
  soldier.add(hips);

  // Combat belt with buckle
  const belt = box(0.44, 0.10, 0.28, colors.webgear);
  belt.position.y = 0.82;
  soldier.add(belt);

  const beltBuckle = box(0.06, 0.08, 0.02, 0x888888);
  beltBuckle.position.set(0, 0.82, 0.14);
  soldier.add(beltBuckle);

  // === CHEST & TORSO ===
  const chest = box(0.48, 0.38, 0.28, colors.uniform);
  chest.position.y = 1.28;
  soldier.add(chest);

  // Pockets detail
  const pocketL = box(0.08, 0.08, 0.03, colors.uniformDark);
  pocketL.position.set(-0.14, 1.15, 0.14);
  soldier.add(pocketL);

  const pocketR = box(0.08, 0.08, 0.03, colors.uniformDark);
  pocketR.position.set(0.14, 1.15, 0.14);
  soldier.add(pocketR);

  // Chest webbing straps (Y-harness style)
  const strapL = box(0.06, 0.42, 0.03, colors.webgear);
  strapL.position.set(-0.11, 1.22, 0.14);
  strapL.rotation.z = 0.25;
  soldier.add(strapL);

  const strapR = box(0.06, 0.42, 0.03, colors.webgear);
  strapR.position.set(0.11, 1.22, 0.14);
  strapR.rotation.z = -0.25;
  soldier.add(strapR);

  // Magazine pouches (armored variant only)
  if (uniformVariant === 1) {
    for (let i = -1; i <= 1; i++) {
      const pouch = box(0.09, 0.14, 0.08, colors.webgear);
      pouch.position.set(i * 0.15, 0.95, 0.12);
      soldier.add(pouch);
    }
  }

  // Backpack (combat/armored)
  if (uniformVariant !== 2) {
    const backpack = box(0.3, 0.32, 0.16, colors.webgear);
    backpack.position.set(0, 1.18, -0.2);
    soldier.add(backpack);

    const backpackStraps = [
      { pos: [-0.08, 1.3, -0.2], rot: 0.2 },
      { pos: [0.08, 1.3, -0.2], rot: -0.2 },
    ];
    for (const strap of backpackStraps) {
      const s = box(0.05, 0.26, 0.02, colors.webgear);
      s.position.set(...strap.pos);
      s.rotation.z = strap.rot;
      soldier.add(s);
    }
  }

  // === HEAD ===
  headGroup = new THREE.Group();
  headGroup.position.y = 1.60;
  soldier.add(headGroup);

  const neck = box(0.14, 0.24, 0.15, palette.skin);
  neck.position.y = -0.10;
  headGroup.add(neck);

  const head = box(0.24, 0.28, 0.25, palette.skin);
  head.position.y = 0.22;
  headGroup.add(head);

  // Jaw with detail
  const jaw = box(0.20, 0.10, 0.23, palette.skin);
  jaw.position.y = 0.08;
  headGroup.add(jaw);

  // Chin detail
  const chin = box(0.18, 0.04, 0.22, palette.skin);
  chin.position.y = 0.02;
  headGroup.add(chin);

  // === HELMET (Steel Helmet M56 style) ===
  const helmetMain = box(0.30, 0.16, 0.30, colors.helmet);
  helmetMain.position.y = 0.35;
  headGroup.add(helmetMain);

  const helmetBrim = box(0.33, 0.04, 0.34, colors.helmet);
  helmetBrim.position.y = 0.27;
  headGroup.add(helmetBrim);

  // Back reinforcement
  const helmetBack = box(0.32, 0.08, 0.08, colors.helmet);
  helmetBack.position.set(0, 0.32, -0.18);
  headGroup.add(helmetBack);

  // Chin strap
  const chinStrap = box(0.06, 0.05, 0.25, colors.webgear);
  chinStrap.position.set(0, 0.10, 0.14);
  headGroup.add(chinStrap);

  // Red star insignia (NVA emblem)
  if (uniformVariant < 2) {
    const star = box(0.05, 0.05, 0.02, 0xcc3333);
    star.position.set(0, 0.32, 0.15);
    headGroup.add(star);
  }

  // === ARMS ===
  function makeArm(side) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.28, 1.38, 0);

    const shoulder = box(0.18, 0.12, 0.17, colors.uniform);
    shoulder.position.y = 0.04;
    pivot.add(shoulder);

    const upperArm = box(0.13, 0.32, 0.16, colors.uniform);
    upperArm.position.y = -0.18;
    pivot.add(upperArm);

    const lowerPivot = new THREE.Group();
    lowerPivot.position.y = -0.35;
    pivot.add(lowerPivot);

    const forearm = box(0.12, 0.30, 0.15, colors.uniformDark);
    forearm.position.y = -0.15;
    lowerPivot.add(forearm);

    // Sleeve detail/cuff
    const cuff = box(0.14, 0.06, 0.17, colors.webgear);
    cuff.position.y = -0.32;
    lowerPivot.add(cuff);

    const hand = box(0.10, 0.12, 0.12, palette.skin);
    hand.position.y = -0.32;
    lowerPivot.add(hand);

    const gripPoint = new THREE.Group();
    gripPoint.position.y = -0.32;
    lowerPivot.add(gripPoint);

    pivot.kneePivot = lowerPivot;
    pivot.gripPoint = gripPoint;
    return pivot;
  }

  armL = makeArm(-1);
  armR = makeArm(1);
  soldier.add(armL, armR);

  // === LEGS ===
  function makeLeg(side) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.13, 0.82, 0);

    const thigh = box(0.16, 0.44, 0.18, colors.uniformDark);
    thigh.position.y = -0.22;
    pivot.add(thigh);

    const lowerPivot = new THREE.Group();
    lowerPivot.position.y = -0.44;
    pivot.add(lowerPivot);

    const calf = box(0.14, 0.42, 0.16, colors.uniform);
    calf.position.y = -0.21;
    lowerPivot.add(calf);

    // Boot (high-top military style)
    const boot = box(0.16, 0.14, 0.25, colors.boots);
    boot.position.set(0, -0.48, 0.04);
    lowerPivot.add(boot);

    // Boot heel/sole detail
    const bootSole = box(0.17, 0.03, 0.26, 0x0a0a0a);
    bootSole.position.set(0, -0.54, 0.04);
    lowerPivot.add(bootSole);

    // Boot laces detail
    const laces = box(0.03, 0.12, 0.25, 0x3a3a3a);
    laces.position.set(0, -0.48, 0.08);
    lowerPivot.add(laces);

    pivot.kneePivot = lowerPivot;
    return pivot;
  }

  legL = makeLeg(-1);
  legR = makeLeg(1);
  legLLower = legL.kneePivot;
  legRLower = legR.kneePivot;
  soldier.add(legL, legR);

  // === RIFLE (East German AK derivative / MPiKM74 style) ===
  rifle = new THREE.Group();

  const barrel = box(0.048, 0.048, 0.34, 0x1a1a1a);
  barrel.position.set(0, 0.06, 0.35);
  rifle.add(barrel);

  // Gas tube above barrel
  const gasTube = cylinder(0.04, 0.04, 0.22, 0x2a2a2a);
  gasTube.position.set(0, 0.14, 0.18);
  rifle.add(gasTube);

  const receiver = box(0.075, 0.10, 0.28, 0x1a1a1a);
  receiver.position.set(0, 0.04, 0.08);
  rifle.add(receiver);

  // Magazine (curved, distinctive AK-style)
  const magazine = box(0.052, 0.24, 0.055, 0x1a1a1a);
  magazine.position.set(0, -0.14, 0.13);
  magazine.rotation.x = 0.15;
  rifle.add(magazine);

  // Charging handle
  const charger = box(0.04, 0.05, 0.08, 0x2a2a2a);
  charger.position.set(0.08, 0.08, 0.16);
  rifle.add(charger);

  // Pistol grip (curved)
  const pistolGrip = box(0.06, 0.14, 0.06, 0x0f0f0f);
  pistolGrip.position.set(0, -0.04, -0.01);
  pistolGrip.rotation.x = -0.4;
  rifle.add(pistolGrip);

  // Stock (side-folding style)
  const stockTube = box(0.035, 0.035, 0.28, 0x3a3a3a);
  stockTube.position.set(0, 0.01, -0.18);
  rifle.add(stockTube);

  const stockPlate = box(0.035, 0.10, 0.04, 0x3a3a3a);
  stockPlate.position.set(0, -0.02, -0.32);
  rifle.add(stockPlate);

  // Muzzle brake detail
  const muzzle = box(0.08, 0.08, 0.06, 0x222222);
  muzzle.position.set(0, 0.06, 0.54);
  rifle.add(muzzle);

  // Muzzle flash
  muzzleFlash = box(0.16, 0.16, 0.08, 0xffdd55, false);
  muzzleFlash.material.transparent = true;
  muzzleFlash.material.opacity = 0.95;
  muzzleFlash.material.emissive = new THREE.Color(0xffaa00);
  muzzleFlash.material.emissiveIntensity = 2.5;
  muzzleFlash.position.set(0, 0.06, 0.58);
  muzzleFlash.visible = false;
  rifle.add(muzzleFlash);

  // Rifle positioning
  rifle.position.set(0.03, -0.03, 0.05);
  rifle.rotation.set(0.12, -0.06, 0.14);
  armR.gripPoint.add(rifle);

  // === ARM & LEG POSITIONING (ready stance) ===
  armR.rotation.set(-1.87, 0.12, 0.12);
  armR.kneePivot.rotation.set(0.38, 0, 0);

  armL.rotation.set(-1.82, -0.16, -0.16);
  armL.kneePivot.rotation.set(0.16, 0, 0);

  soldier.traverse(o => { 
    if (o.isMesh) { 
      o.castShadow = true; 
      o.receiveShadow = true; 
    } 
  });

  soldier.position.set(0, 0, 0);
  scene.add(soldier);

  // Shadow blob
  const shadowGeo = new THREE.CircleGeometry(0.42, 24);
  const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 });
  const shadowBlob = new THREE.Mesh(shadowGeo, shadowMat);
  shadowBlob.rotation.x = -Math.PI / 2;
  shadowBlob.position.y = 0.01;
  soldier.add(shadowBlob);
}

createSoldier(0);

// ============================================================================
// UNIFORM SELECTOR
// ============================================================================
document.querySelectorAll('#uniformSelect button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('#uniformSelect button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentUniformVariant = parseInt(e.target.dataset.uniform);
    createSoldier(currentUniformVariant);
  });
});

// ============================================================================
// ADVANCED CAMERA RIG
// ============================================================================
let yaw = 0;
let pitch = 0.35;
const PITCH_MIN = 0.05;
const PITCH_MAX = 1.4;

let camDistance = 4.5;
let camHeightOffset = 1.15;
let camTiltX = 0;
let camTiltZ = 0;

const CAM_DISTANCE_MIN = 2.0;
const CAM_DISTANCE_MAX = 12.0;

function updateCamera() {
  const dist = camDistance;
  
  // Spherical coordinates around soldier
  const camX = soldier.position.x - Math.sin(yaw) * Math.cos(pitch) * dist;
  const camZ = soldier.position.z - Math.cos(yaw) * Math.cos(pitch) * dist;
  const camY = soldier.position.y + camHeightOffset + Math.sin(pitch) * dist;
  
  camera.position.set(camX, camY, camZ);
  
  // Look-at target with slight bob
  const lookTargetY = soldier.position.y + 1.05 + (Math.sin(strideCycle) * 0.02);
  camera.lookAt(
    soldier.position.x,
    lookTargetY,
    soldier.position.z
  );
}

updateCamera();

// ============================================================================
// POINTER LOCK + MOUSE LOOK
// ============================================================================
const clickCatcher = document.getElementById('clickCatcher');
const canvas = renderer.domElement;

clickCatcher.addEventListener('click', () => {
  canvas.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) {
    clickCatcher.classList.add('hidden');
  } else {
    clickCatcher.classList.remove('hidden');
  }
});

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0028;
  pitch += e.movementY * 0.0028;
  pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
});

// ============================================================================
// INPUT STATE
// ============================================================================
const keys = {};
window.addEventListener('keydown', (e) => { 
  keys[e.code] = true;
  
  // Camera distance control
  if (e.code === 'KeyQ') camDistance = Math.max(CAM_DISTANCE_MIN, camDistance - 0.4);
  if (e.code === 'KeyE') camDistance = Math.min(CAM_DISTANCE_MAX, camDistance + 0.4);
  
  // Camera height tilt
  if (e.code === 'KeyZ') camHeightOffset = Math.max(0.5, camHeightOffset - 0.15);
  if (e.code === 'KeyX') camHeightOffset = Math.min(2.0, camHeightOffset + 0.15);
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

let touchMoveX = 0;
let touchMoveZ = 0;

// ============================================================================
// MOBILE CONTROLS
// ============================================================================
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

if (isTouchDevice) {
  const mobileControls = document.getElementById('mobileControls');
  mobileControls.classList.add('active');
  clickCatcher.classList.add('hidden');

  const joystickZone = document.getElementById('joystickZone');
  const joystickStick = document.getElementById('joystickStick');
  let joystickTouchId = null;
  let joystickCenter = { x: 0, y: 0 };
  const JOYSTICK_RADIUS = 55;

  function joystickStart(e) {
    const touch = e.changedTouches[0];
    joystickTouchId = touch.identifier;
    const rect = joystickZone.getBoundingClientRect();
    joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    e.preventDefault();
  }
  function joystickMove(e) {
    for (const touch of e.changedTouches) {
      if (touch.identifier !== joystickTouchId) continue;
      let dx = touch.clientX - joystickCenter.x;
      let dy = touch.clientY - joystickCenter.y;
      const dist = Math.min(Math.hypot(dx, dy), JOYSTICK_RADIUS);
      const angle = Math.atan2(dy, dx);
      const clampedX = Math.cos(angle) * dist;
      const clampedY = Math.sin(angle) * dist;
      joystickStick.style.transform = `translate(${clampedX}px, ${clampedY}px)`;
      touchMoveX = clampedX / JOYSTICK_RADIUS;
      touchMoveZ = clampedY / JOYSTICK_RADIUS;
      e.preventDefault();
    }
  }
  function joystickEnd(e) {
    for (const touch of e.changedTouches) {
      if (touch.identifier !== joystickTouchId) continue;
      joystickTouchId = null;
      touchMoveX = 0;
      touchMoveZ = 0;
      joystickStick.style.transform = 'translate(0px, 0px)';
    }
  }
  joystickZone.addEventListener('touchstart', joystickStart, { passive: false });
  joystickZone.addEventListener('touchmove', joystickMove, { passive: false });
  joystickZone.addEventListener('touchend', joystickEnd, { passive: false });

  const lookZone = document.getElementById('lookZone');
  let lookTouchId = null;
  let lastLookX = 0, lastLookY = 0;

  lookZone.addEventListener('touchstart', (e) => {
    const touch = e.changedTouches[0];
    lookTouchId = touch.identifier;
    lastLookX = touch.clientX;
    lastLookY = touch.clientY;
    e.preventDefault();
  }, { passive: false });

  lookZone.addEventListener('touchmove', (e) => {
    for (const touch of e.changedTouches) {
      if (touch.identifier !== lookTouchId) continue;
      const dx = touch.clientX - lastLookX;
      const dy = touch.clientY - lastLookY;
      lastLookX = touch.clientX;
      lastLookY = touch.clientY;
      yaw -= dx * 0.006;
      pitch += dy * 0.006;
      pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
      e.preventDefault();
    }
  }, { passive: false });

  lookZone.addEventListener('touchend', (e) => {
    for (const touch of e.changedTouches) {
      if (touch.identifier === lookTouchId) lookTouchId = null;
    }
  }, { passive: false });

  const jumpBtn = document.getElementById('jumpBtn');
  jumpBtn.addEventListener('touchstart', (e) => { keys['Space'] = true; e.preventDefault(); }, { passive: false });
  jumpBtn.addEventListener('touchend', (e) => { keys['Space'] = false; e.preventDefault(); }, { passive: false });

  const sprintBtn = document.getElementById('sprintBtn');
  sprintBtn.addEventListener('touchstart', (e) => { keys['ShiftLeft'] = true; e.preventDefault(); }, { passive: false });
  sprintBtn.addEventListener('touchend', (e) => { keys['ShiftLeft'] = false; e.preventDefault(); }, { passive: false });
}

// ============================================================================
// FIRING SYSTEM
// ============================================================================
let firing = false;
const FIRE_RATE = 0.08;
let fireCooldown = 0;
let recoilAmount = 0;

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) firing = true;
});
window.addEventListener('mouseup', (e) => {
  if (e.button === 2) firing = false;
});

if (isTouchDevice) {
  const fireBtn = document.getElementById('fireBtn');
  fireBtn.addEventListener('touchstart', (e) => { firing = true; e.preventDefault(); }, { passive: false });
  fireBtn.addEventListener('touchend', (e) => { firing = false; e.preventDefault(); }, { passive: false });
}

const activeTracers = [];
function spawnTracer() {
  const muzzleWorldPos = new THREE.Vector3();
  muzzleFlash.getWorldPosition(muzzleWorldPos);

  const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(rifle.getWorldQuaternion(new THREE.Quaternion()));
  const jitter = 0.015;
  forward.x += (Math.random() - 0.5) * jitter;
  forward.y += (Math.random() - 0.5) * jitter;

  const tracerGeo = new THREE.BoxGeometry(0.018, 0.018, 0.6);
  const tracerMat = new THREE.MeshBasicMaterial({ color: 0xffe080, transparent: true, opacity: 0.85 });
  const tracer = new THREE.Mesh(tracerGeo, tracerMat);

  tracer.position.copy(muzzleWorldPos).addScaledVector(forward, 0.3);
  tracer.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), forward);

  scene.add(tracer);
  activeTracers.push({ mesh: tracer, dir: forward.clone(), life: 0 });
}

function updateTracers(dt) {
  for (let i = activeTracers.length - 1; i >= 0; i--) {
    const t = activeTracers[i];
    t.life += dt;
    t.mesh.position.addScaledVector(t.dir, 45 * dt);
    t.mesh.material.opacity = Math.max(0, 0.85 - t.life * 2.8);
    if (t.life > 0.3) {
      scene.remove(t.mesh);
      t.mesh.geometry.dispose();
      t.mesh.material.dispose();
      activeTracers.splice(i, 1);
    }
  }
}

let muzzleFlashTimer = 0;
const WALK_SPEED = 3.4;
const SPRINT_SPEED = 6.5;
const GRAVITY = -20;
const JUMP_SPEED = 6.5;

let velocityY = 0;
let grounded = true;
let strideCycle = 0;
let landingSquat = 0;

const clock = new THREE.Clock();

function updateCameraInfo() {
  const camInfo = document.getElementById('cameraInfo');
  if (!camInfo) return;
  
  const dist = Math.sqrt(
    Math.pow(camera.position.x - soldier.position.x, 2) +
    Math.pow(camera.position.y - soldier.position.y, 2) +
    Math.pow(camera.position.z - soldier.position.z, 2)
  ).toFixed(1);
  
  camInfo.innerHTML = `CAM: ${dist}m | HEIGHT: ${camHeightOffset.toFixed(2)}`;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Movement input
  let moveX = 0, moveZ = 0;
  if (keys['KeyW']) moveZ -= 1;
  if (keys['KeyS']) moveZ += 1;
  if (keys['KeyA']) moveX -= 1;
  if (keys['KeyD']) moveX += 1;

  moveX = Math.max(-1, Math.min(1, moveX + touchMoveX));
  moveZ = Math.max(-1, Math.min(1, moveZ + touchMoveZ));

  const moving = Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05;
  let speed = keys['ShiftLeft'] || keys['ShiftRight'] ? SPRINT_SPEED : WALK_SPEED;

  if (moving) {
    const len = Math.hypot(moveX, moveZ);
    moveX /= len; moveZ /= len;

    const worldX = moveX * Math.cos(yaw) - moveZ * Math.sin(yaw);
    const worldZ = moveX * Math.sin(yaw) + moveZ * Math.cos(yaw);

    soldier.position.x += worldX * speed * dt;
    soldier.position.z += worldZ * speed * dt;

    const targetFacing = Math.atan2(worldX, worldZ);
    let diff = targetFacing - soldier.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    soldier.rotation.y += diff * Math.min(1, 14 * dt);

    strideCycle += dt * (speed / WALK_SPEED) * 8;
  } else {
    strideCycle *= 0.88;
  }

  // Jump / gravity
  if (keys['Space'] && grounded) {
    velocityY = JUMP_SPEED;
    grounded = false;
  }
  velocityY += GRAVITY * dt;
  soldier.position.y += velocityY * dt;
  if (soldier.position.y <= 0) {
    if (!grounded) {
      landingSquat = Math.min(1, Math.abs(velocityY) / JUMP_SPEED);
    }
    soldier.position.y = 0;
    velocityY = 0;
    grounded = true;
  }

  // Leg animation
  const swing = Math.sin(strideCycle) * 0.62;
  const swingOpp = Math.sin(strideCycle + Math.PI) * 0.62;

  if (grounded) {
    legL.rotation.x = swing;
    legR.rotation.x = swingOpp;
    legLLower.rotation.x = 0;
    legRLower.rotation.x = 0;
    
    armR.rotation.set(-1.87 + swingOpp * 0.15, 0.12, 0.12);
    armR.kneePivot.rotation.set(0.38, 0, 0);
    armL.rotation.set(-1.82 + swing * 0.15, -0.16, -0.16);
    armL.kneePivot.rotation.set(0.16, 0, 0);
  }

  // Bob when walking
  const bob = moving && grounded ? Math.abs(Math.sin(strideCycle)) * 0.05 : 0;
  torso.position.y = 1.28 + bob;
  headGroup.position.y = 1.60 + bob;

  // Head look
  headGroup.rotation.x = pitch * 0.12;

  // Jump animation
  const HIP_BEND_MAX = 0.6;
  const KNEE_BEND_MAX = 1.1;

  if (!grounded) {
    const upPhase = Math.max(0, velocityY) / JUMP_SPEED;
    const downPhase = Math.max(0, -velocityY) / JUMP_SPEED;

    const hipBend = THREE.MathUtils.clamp(-0.5 * upPhase + 0.35 * Math.min(downPhase, 1), -HIP_BEND_MAX, HIP_BEND_MAX);
    const kneeBend = THREE.MathUtils.clamp(0.9 * upPhase + 0.4 * Math.min(downPhase, 1), 0, KNEE_BEND_MAX);

    legL.rotation.x = hipBend;
    legR.rotation.x = hipBend;
    legLLower.rotation.x = kneeBend;
    legRLower.rotation.x = kneeBend;

    armR.rotation.set(-1.87 - upPhase * 0.1 - recoilAmount * 0.06, 0.12, 0.12);
    armL.rotation.set(-1.82 - upPhase * 0.1, -0.16, -0.16);

    torso.position.y = 1.28 - upPhase * 0.06;
    headGroup.position.y = 1.60 - upPhase * 0.06;
  } else {
    landingSquat *= 0.80;
    if (landingSquat > 0.01) {
      const hipAdd = THREE.MathUtils.clamp(landingSquat * 0.55, 0, HIP_BEND_MAX);
      const kneeAdd = THREE.MathUtils.clamp(landingSquat * 1.0, 0, KNEE_BEND_MAX);
      legL.rotation.x = THREE.MathUtils.clamp(legL.rotation.x + hipAdd, -HIP_BEND_MAX, HIP_BEND_MAX);
      legR.rotation.x = THREE.MathUtils.clamp(legR.rotation.x + hipAdd, -HIP_BEND_MAX, HIP_BEND_MAX);
      legLLower.rotation.x = THREE.MathUtils.clamp(legLLower.rotation.x + kneeAdd, 0, KNEE_BEND_MAX);
      legRLower.rotation.x = THREE.MathUtils.clamp(legRLower.rotation.x + kneeAdd, 0, KNEE_BEND_MAX);
      torso.position.y -= landingSquat * 0.07;
      headGroup.position.y -= landingSquat * 0.07;
    }
    
    if (landingSquat < 0.01) landingSquat = 0;
  }

  updateCamera();
  updateCameraInfo();

  // Firing
  fireCooldown -= dt;
  recoilAmount *= 0.82;
  
  if (firing && fireCooldown <= 0) {
    fireCooldown = FIRE_RATE;
    muzzleFlashTimer = 0.04;
    spawnTracer();
    recoilAmount = 0.35;
  }
  
  if (muzzleFlashTimer > 0) {
    muzzleFlashTimer -= dt;
    muzzleFlash.visible = true;
    muzzleFlash.rotation.z = Math.random() * Math.PI;
    const s = 0.9 + Math.random() * 0.35;
    muzzleFlash.scale.set(s, s, s);
  } else {
    muzzleFlash.visible = false;
  }
  
  updateTracers(dt);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
